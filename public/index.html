<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>UtilityHub</title>

    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>

<body>

<header class="header">
    <div class="brand">
        <h1>🛠 UtilityHub</h1>
        <p>Developer Tools in One Place</p>
    </div>

    <button id="themeToggle" class="theme-btn">
        🌙 Dark
    </button>
</header>

<section class="hero">
    <input id="search" class="search" placeholder="Search tools..."/>
</section>

<main class="grid">

    <div class="card" onclick="showTool('string')">
        <i class="fa-solid fa-font"></i>
        <h2>String Length</h2>
        <p>Count characters instantly</p>
    </div>

    <div class="card" onclick="showTool('json')">
        <i class="fa-solid fa-code"></i>
        <h2>JSON Formatter</h2>
        <p>Format & validate JSON</p>
    </div>

</main>

<section id="toolContainer" class="tool-box"></section>

<script src="js/app.js"></script>
</body>

</html>
