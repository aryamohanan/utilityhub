<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtilityHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<h1>UtilityHub</h1>

<p>Simple Developer Utilities</p>

<input
type="text"
id="search"
placeholder="Search tools..."
>

</header>

<main id="tools">

<div class="card" onclick="showTool('string')">
<h2>String Length</h2>
<p>Calculate characters instantly.</p>
</div>

<div class="card" onclick="showTool('json')">
<h2>JSON Formatter</h2>
<p>Pretty print JSON.</p>
</div>

</main>

<section id="toolContainer"></section>

<script src="js/app.js"></script>

</body>

</html>
